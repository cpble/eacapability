<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eacapability demo</title>
  <style>
    body { margin: 0; padding: 24px 16px; font-family: system-ui, sans-serif; background: #f6f7f9; }
    body.dark { background: #13171c; color: #e7eaee; }
    main { max-width: 1400px; margin: 0 auto; }
    p { color: #5b6573; }
  </style>
  <script type="module" src="../dist/index.js"></script>
</head>
<body>
  <main>
    <h1>eacapability</h1>
    <p><label><input type="checkbox" id="dark"> Dark</label> · Click a capability to see the <code>ea-select</code> event: <output id="chosen">nothing yet</output></p>
    <ea-capability-map id="map" src="higher-education.json" selectable></ea-capability-map>
  </main>
  <script type="module">
    const map = document.getElementById('map');
    map.addEventListener('ea-select', (event) => { document.getElementById('chosen').textContent = event.detail.path.join(' > '); });
    document.getElementById('dark').addEventListener('change', (event) => {
      map.setAttribute('theme', event.target.checked ? 'dark' : 'light');
      document.body.classList.toggle('dark', event.target.checked);
    });
  </script>
</body>
</html>
